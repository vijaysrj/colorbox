<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#EAF3FB;
  --surface:#FFFFFF;
  --ink:#2A2238;
  --muted:#5E5873;
  --line:#2A2238;
  --sun:#FFC93C;
  --berry:#E8457A;
  --chip:#FFFFFF;
  --shadow:#2A2238;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --paper:#1B1930;
    --surface:#28253F;
    --ink:#F3EFFF;
    --muted:#B9B2D3;
    --line:#E9E3FF;
    --sun:#FFC93C;
    --berry:#FF6E9C;
    --chip:#28253F;
    --shadow:#0E0C1C;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Andika",system-ui,sans-serif;
  font-size:17px;
  line-height:1.45;
  min-height:100dvh;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:8px}
main{max-width:1120px;margin:0 auto;padding:20px 16px 40px}

/* ---------- Gallery ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 22px;margin:6px 0 22px}
.logo{
  font-family:"Grandstander",cursive;font-weight:800;
  font-size:clamp(44px,9vw,76px);line-height:.95;margin:0;letter-spacing:-.01em;
  -webkit-text-stroke:2px var(--line);paint-order:stroke fill;
}
.logo span{display:inline-block}
.logo span:nth-child(odd){transform:translateY(3px) rotate(-3deg)}
.logo span:nth-child(even){transform:translateY(-2px) rotate(2deg)}
.lede{margin:0 0 8px;color:var(--muted);font-size:18px;max-width:34ch}

.ages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px;max-width:640px}
.age{
  background:var(--surface);border:3px solid var(--line);border-radius:18px;
  padding:10px 12px;text-align:left;display:flex;align-items:baseline;gap:10px;
  box-shadow:4px 4px 0 var(--shadow);transition:transform .12s, box-shadow .12s;
}
.age b{font-family:"Grandstander",cursive;font-weight:800;font-size:30px;line-height:1}
.age small{font-size:14px;color:var(--muted);line-height:1.2}
.age[aria-selected="true"]{background:var(--sun);color:#2A2238;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.age[aria-selected="true"] small{color:#2A2238}
@media (max-width:520px){.age{flex-direction:column;gap:2px}.age b{font-size:26px}}

.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.cat{background:var(--chip);border:2.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px}
.tile{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:center}
.tile .paper{
  display:block;background:#fff;border:3px solid var(--line);border-radius:18px 14px 20px 12px;
  padding:6px;aspect-ratio:1;transform:rotate(var(--r,0deg));transition:transform .15s;
  box-shadow:4px 5px 0 var(--shadow);
}
.tile:nth-child(3n+1){--r:-1.6deg}
.tile:nth-child(3n+2){--r:1.2deg}
.tile:nth-child(3n){--r:-.4deg}
.tile:hover .paper,.tile:focus-visible .paper{transform:rotate(0) translateY(-4px)}
.tile:focus-visible{outline:none}
.tile:focus-visible .paper{outline:3px solid var(--berry);outline-offset:4px}
.tile svg{width:100%;height:100%;display:block}
.tile .nm{font-weight:700;font-size:16px}

/* ---------- Colouring ---------- */
.cbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2.5px solid var(--line);border-radius:999px;padding:8px 16px 8px 12px;font-weight:700}
.cbar h2{font-family:"Grandstander",cursive;font-weight:800;font-size:clamp(24px,4vw,32px);margin:0;line-height:1.1}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tool{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:2.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:15px}
.tool svg,.back svg{width:20px;height:20px;flex:none}
.tool[aria-pressed="true"]{background:var(--sun);color:#2A2238}
.tool:disabled{opacity:.4;cursor:default}
@media (max-width:600px){.tools{margin-left:0;width:100%}.tool span{display:none}.tool{padding:10px 14px}}

.stage{display:grid;place-items:center;padding:8px 0 16px}
.sheet{
  width:max(280px,min(100%,calc(100dvh - 300px),680px));aspect-ratio:1;
  background:#fff;border:3px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:6px 7px 0 var(--shadow);touch-action:manipulation;
}
.sheet svg{width:100%;height:100%;display:block;cursor:pointer}
.sheet [data-i]{transition:fill .2s}

.trayBox{position:relative;max-width:920px;margin:0 auto}
.tray{
  display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;height:108px;padding:0 22px;justify-content:safe center;
  scrollbar-width:thin;
}
.crayon{
  flex:0 0 36px;height:124px;border:0;padding:0;background:none;position:relative;
  transform:translateY(32px);transition:transform .18s cubic-bezier(.3,1.5,.6,1);
}
.crayon:hover{transform:translateY(20px)}
.crayon[aria-pressed="true"]{transform:translateY(2px)}
.crayon .tip{position:absolute;top:0;left:7px;right:7px;height:26px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);filter:brightness(.9)}
.crayon .body{position:absolute;top:24px;left:0;right:0;bottom:0;background:var(--c);border-radius:5px 5px 0 0;box-shadow:inset 0 0 0 2px rgba(42,34,56,.28),inset -7px 0 0 rgba(0,0,0,.1)}
.crayon .body::before{content:"";position:absolute;left:0;right:0;top:14px;height:22px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px);border-top:2px solid rgba(0,0,0,.22);border-bottom:2px solid rgba(0,0,0,.22)}
.crayon.custom .body{background:conic-gradient(#E8383D,#FFD23F,#2FA84F,#4FC3F7,#8E44AD,#E8383D)}
.crayon.custom .body::after{content:"";position:absolute;left:8px;right:8px;top:8px;height:20px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff}
.crayon input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.lip{
  position:absolute;left:0;right:0;bottom:-2px;height:38px;pointer-events:none;
  background:var(--sun);border:3px solid #2A2238;border-radius:12px 12px 18px 18px;
  display:flex;align-items:center;justify-content:center;
  font-family:"Grandstander",cursive;font-weight:800;color:#2A2238;font-size:18px;letter-spacing:.02em;
}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,140%);
  background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:999px;
  font-family:"Grandstander",cursive;font-weight:800;font-size:20px;transition:transform .3s,visibility .3s;z-index:20;visibility:hidden;
  white-space:nowrap;
}
.toast.show{transform:translate(-50%,0);visibility:visible}
.bit{position:fixed;top:-20px;width:10px;height:18px;border-radius:3px;z-index:19;animation:fall 1.8s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .bit{display:none}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="gallery">
    <header class="top">
      <h1 class="logo" aria-label="Colour Box"></h1>
      <p class="lede">Pick a picture, then tap any part of it to colour it in.</p>
    </header>
    <div class="ages" id="ages" role="tablist" aria-label="Age group"></div>
    <div class="cats" id="cats" aria-label="Picture type"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="colour" hidden>
    <div class="cbar">
      <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>All pictures</button>
      <h2 id="picName"></h2>
      <div class="tools">
        <button class="tool" id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg><span>Undo</span></button>
        <button class="tool" id="eraser" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M14.5 4.5l5 5L10 19H5l-1.5-1.5a2 2 0 010-2.8z"/><path d="M9 10l5 5"/></svg><span>Eraser</span></button>
        <button class="tool" id="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 108-8 8 8 0 00-6 2.7"/><path d="M4 3v5h5"/></svg><span>Start over</span></button>
        <button class="tool" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span>Save picture</span></button>
      </div>
    </div>
    <div class="stage"><div class="sheet" id="sheet"></div></div>
    <div class="trayBox">
      <div class="tray" id="tray" role="group" aria-label="Crayons"></div>
      <div class="lip">Colour Box</div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ drawing helpers ============ */
const INK = '#2A2238';
const K = 'class="k"';
const f = n => +(+n).toFixed(1);
const P = (d,a='') => `<path d="${d}" ${a}/>`;
const C = (x,y,r,a='') => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" ${a}/>`;
const E = (x,y,rx,ry,a='') => `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" ${a}/>`;
const R = (x,y,w,h,rx=0,a='') => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${rx}" ${a}/>`;
const G = (pts,a='') => `<polygon points="${pts}" ${a}/>`;
const L = d => `<path d="${d}" fill="none"/>`;
const mir = s => `<g transform="matrix(-1 0 0 1 400 0)">${s}</g>`;
const pt = (cx,cy,r,a) => `${f(cx+r*Math.cos(a))} ${f(cy+r*Math.sin(a))}`;
const rng = s => () => { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const star = (cx,cy,Ro,ri,n=5,a='') => { let d=''; for(let i=0;i<2*n;i++){const rr=i%2?ri:Ro, an=i*Math.PI/n-Math.PI/2; d+=(i?'L':'M')+f(cx+rr*Math.cos(an))+' '+f(cy+rr*Math.sin(an));} return P(d+'Z',a); };
const CLOUD = 'M-60 20 A25 25 0 0 1 -55 -25 A35 35 0 0 1 5 -40 A30 30 0 0 1 55 -20 A22 22 0 0 1 60 20 Z';
const cloud = (x,y,s=1) => P(CLOUD,`transform="translate(${x} ${y}) scale(${s})" data-s="${s}"`);
const sector = (cx,cy,r0,r1,a0,a1) => {
  const big = (a1-a0) > Math.PI ? 1 : 0;
  return r0 <= 0
    ? P(`M${cx} ${cy} L${pt(cx,cy,r1,a0)} A${r1} ${r1} 0 ${big} 1 ${pt(cx,cy,r1,a1)} Z`)
    : P(`M${pt(cx,cy,r1,a0)} A${r1} ${r1} 0 ${big} 1 ${pt(cx,cy,r1,a1)} L${pt(cx,cy,r0,a1)} A${r0} ${r0} 0 ${big} 0 ${pt(cx,cy,r0,a0)} Z`);
};
const ring = (x,y,R1,a1,R0,a0,rot,front) => P(front
  ? `M${f(x-R1)} ${f(y)} A${f(R1)} ${f(a1)} 0 0 0 ${f(x+R1)} ${f(y)} L${f(x+R0)} ${f(y)} A${f(R0)} ${f(a0)} 0 0 1 ${f(x-R0)} ${f(y)} Z`
  : `M${f(x-R1)} ${f(y)} A${f(R1)} ${f(a1)} 0 0 1 ${f(x+R1)} ${f(y)} L${f(x+R0)} ${f(y)} A${f(R0)} ${f(a0)} 0 0 0 ${f(x-R0)} ${f(y)} Z`,
  `transform="rotate(${rot} ${f(x)} ${f(y)})"`);
const fishG = (x,y,s,flip) => `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})" data-s="${s}">${G('38,0 70,-26 70,26')}${E(0,0,46,28)}${P('M10 -27 Q22 0 10 27 Q-2 0 10 -27 Z')}${C(-22,-6,8)}${C(-22,-6,4,K)}</g>`;
const leaf = (x,y,s,rot) => P('M0 0 Q14 -12 34 0 Q14 12 0 0 Z',`transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${f(s)})" data-s="${f(s)}"`);

function mandala(layers){
  const cx=200, cy=200; let s='';
  const p = (r,a) => pt(cx,cy,r,a);
  for (const [t,n,r0,r1,off=0] of layers){
    if (t==='ring'){ s+=C(cx,cy,r1); continue; }
    const h = Math.PI/n;
    for (let i=0;i<n;i++){
      const a = (i+off)*2*h - Math.PI/2;
      if (t==='petal' || t==='drop'){
        const w = t==='petal' ? h*.95 : h*.55, rm = r0+(r1-r0)*.45;
        s+=P(`M${p(r0,a-w)} C${p(rm,a-w*1.25)} ${p(r1*.97,a-w*.35)} ${p(r1,a)} C${p(r1*.97,a+w*.35)} ${p(rm,a+w*1.25)} ${p(r0,a+w)} Z`);
      } else if (t==='sector'){
        s+=sector(cx,cy,r0,r1,a-h,a+h);
      } else if (t==='scallop'){
        const d=(r1-r0)*.3;
        s+=P(`M${p(r0,a-h)} L${p(r1-d,a-h)} Q${p(r1+d,a)} ${p(r1-d,a+h)} L${p(r0,a+h)} Z`);
      } else if (t==='dot'){
        const r=(r0+r1)/2;
        s+=C(cx+r*Math.cos(a), cy+r*Math.sin(a), (r1-r0)/2*.85);
      } else if (t==='leaf'){
        const w=h*.8, rm=(r0+r1)/2;
        s+=P(`M${p(r0,a)} Q${p(rm,a-w*1.4)} ${p(r1,a)} Q${p(rm,a+w*1.4)} ${p(r0,a)} Z`);
      }
    }
  }
  return s;
}

/* ============ the pictures ============ */
const PICS = [];
const add = (id,name,age,cat,art) => PICS.push({id,name,age,cat,art});

/* ----- Ages 3–5: big, simple shapes ----- */
add('cat','Kitty cat','s','Animals',()=>
  P('M262 300 C330 312 352 262 332 212 C322 196 306 206 313 222 C326 256 316 282 262 280 Z')+
  E(200,292,85,70)+G('128,140 140,60 190,112')+G('272,140 260,60 210,112')+C(200,162,75)+
  C(172,150,9,K)+C(228,150,9,K)+G('190,178 210,178 200,190')+
  L('M150 185 L108 176 M150 196 L108 202 M250 185 L292 176 M250 196 L292 202 M184 200 Q200 214 216 200'));

add('teddy','Teddy bear','s','Animals',()=>
  C(130,95,36)+C(270,95,36)+C(130,95,18)+C(270,95,18)+
  E(112,255,30,48,'transform="rotate(25 112 255)"')+E(288,255,30,48,'transform="rotate(-25 288 255)"')+
  C(140,350,38)+C(260,350,38)+C(140,352,18)+C(260,352,18)+
  E(200,280,85,88)+E(200,295,50,55)+C(200,150,75)+E(200,182,36,27)+
  E(200,170,12,8,K)+C(172,140,8,K)+C(228,140,8,K)+L('M200 178 L200 192 M188 196 Q200 204 212 196'));

add('turtle','Turtle','s','Animals',()=>
  P('M0 330 L400 330 L400 400 L0 400 Z')+
  E(130,292,24,32)+E(270,292,24,32)+C(330,232,40)+G('85,262 55,280 88,282')+
  P('M90 272 Q90 130 200 130 Q310 130 310 272 Z')+
  G('160,190 200,166 240,190 240,232 200,254 160,232')+
  L('M160 190 L118 168 M240 190 L282 168 M160 232 L105 255 M240 232 L295 255 M200 166 L200 135 M200 254 L200 272')+
  R(80,262,240,24,12)+C(344,222,7,K)+L('M335 248 Q348 256 360 246')+C(60,70,30));

add('fish','Happy fish','s','Ocean',()=>
  G('292,200 372,138 372,262')+P('M150 138 Q200 68 252 140 Z')+P('M180 268 Q205 322 232 266 Z')+
  E(200,200,110,75)+P('M235 132 Q258 200 235 268 Q212 200 235 132 Z')+
  C(140,185,17)+C(144,185,8,K)+L('M110 225 Q125 238 140 228')+
  C(68,118,14)+C(48,78,9)+C(78,48,6));

add('car','Little car','s','Vehicles',()=>
  C(70,70,30)+cloud(290,80,.8)+R(-2,312,404,90)+R(20,352,50,8,4)+R(130,352,50,8,4)+R(240,352,50,8,4)+R(350,352,50,8,4)+
  P('M48 272 L48 222 Q52 200 80 200 L118 200 L150 145 Q158 135 172 135 L258 135 Q274 135 284 148 L320 200 L344 205 Q366 210 366 236 L366 272 Z')+
  P('M164 155 L136 200 L198 200 L198 155 Z')+P('M214 155 L214 200 L298 200 L268 158 Q265 155 258 155 Z')+
  C(120,276,38)+C(300,276,38)+C(120,276,15)+C(300,276,15)+C(354,228,9)+R(48,232,28,12,4)+L('M206 210 L206 262 M222 222 L238 222'));

add('boat','Sailing boat','s','Vehicles',()=>
  C(70,80,36)+cloud(300,80,.8)+R(196,70,9,210)+P('M212 100 L212 258 L322 258 Z')+P('M189 120 L189 258 L100 258 Z')+
  G('205,70 245,82 205,94')+P('M78 278 L322 278 L286 330 L114 330 Z')+C(160,302,9)+C(200,302,9)+C(240,302,9)+
  P('M0 325 Q50 305 100 325 T200 325 T300 325 T400 325 L400 400 L0 400 Z'));

add('train','Choo-choo train','s','Vehicles',()=>
  cloud(205,82,.45)+cloud(140,50,.6)+R(-2,326,404,14)+
  R(214,118,32,56,4)+R(206,110,48,14,4)+R(180,172,100,98,10)+R(262,130,96,140,6)+R(250,118,120,16,6)+
  R(282,148,56,46,6)+G('180,248 148,292 180,292')+R(150,268,220,22,6)+
  C(205,300,26)+C(262,300,26)+C(322,300,26)+C(205,300,9)+C(262,300,9)+C(322,300,9)+C(196,204,12));

add('flower','Sunny flower','s','Nature',()=>
  C(345,60,30)+R(-2,365,404,37)+R(193,215,14,155,7)+
  P('M200 300 Q140 258 118 290 Q150 322 200 300 Z')+P('M200 332 Q260 290 282 322 Q250 352 200 332 Z')+
  C(255,160,40)+C(227.5,207.6,40)+C(172.5,207.6,40)+C(145,160,40)+C(172.5,112.4,40)+C(227.5,112.4,40)+
  C(200,160,38)+C(186,152,5,K)+C(214,152,5,K)+L('M186 172 Q200 182 214 172'));

add('rainbow','Rainbow','s','Nature',()=>{
  const band=(r1,r0)=>P(`M${200-r1} 300 A${r1} ${r1} 0 0 1 ${200+r1} 300 L${200+r0} 300 A${r0} ${r0} 0 0 0 ${200-r0} 300 Z`);
  return C(345,60,30)+band(165,140)+band(140,115)+band(115,90)+band(90,65)+band(65,40)+cloud(70,300,1)+cloud(330,300,1);
});

add('house','My house','s','Places',()=>
  C(62,62,32)+cloud(300,60,.7)+R(248,100,30,60)+R(100,190,200,160)+G('80,192 200,92 320,192')+
  R(175,270,50,80,4)+C(214,312,4,K)+R(120,215,45,45,4)+R(235,215,45,45,4)+
  L('M142 215 L142 260 M120 237 L165 237 M257 215 L257 260 M235 237 L280 237')+C(200,150,18)+
  P('M0 345 Q200 330 400 345 L400 400 L0 400 Z'));

add('apple','Shiny apple','s','Food',()=>
  R(195,72,10,50,4,'transform="rotate(10 200 97)"')+P('M206 96 Q252 58 280 86 Q244 118 206 96 Z')+
  P('M200 122 C150 92 82 112 86 202 C90 292 150 340 200 320 C250 340 310 292 314 202 C318 112 250 92 200 122 Z')+
  L('M130 180 Q132 150 158 138'));

add('icecream','Ice cream','s','Food',()=>
  G('140,205 260,205 200,365')+L('M160 240 L240 240 M174 280 L226 280 M187 320 L213 320')+
  L('M200 70 Q205 50 222 40')+C(200,150,58)+
  P('M138 190 Q148 218 165 200 Q176 228 190 202 Q204 224 216 202 Q230 228 242 200 Q254 216 262 190 Z')+
  C(200,84,16)+C(172,130,6)+C(225,120,6)+C(205,160,6)+C(240,155,6));

add('rocket','Rocket','s','Space',()=>

add('logcabin','Log cabin quilt','l','Patterns',()=>{
  let s=''; const S=95, w=10;
  for(let by=0;by<4;by++) for(let bx=0;bx<4;bx++){
    const cx=10+bx*S+S/2, cy=10+by*S+S/2;
    let x0=cx-7.5, y0=cy-7.5, x1=cx+7.5, y1=cy+7.5;
    s+=R(x0,y0,15,15);
    for(let k=0;k<16;k++){
      const side=(k+bx+by*2)%4;
      if(side===0){ s+=R(x0,y0-w,x1-x0,w); y0-=w; }
      else if(side===1){ s+=R(x1,y0,w,y1-y0); x1+=w; }
      else if(side===2){ s+=R(x0,y1,x1-x0,w); y1+=w; }
      else { s+=R(x0-w,y0,w,y1-y0); x0-=w; }
    }
  }
  return s;
});

});

/* ============ rendering ============ */
const AGES=[{k:'s',n:'3–5',l:'Little hands'},{k:'m',n:'6–8',l:'Growing artists'},{k:'l',n:'9+',l:'Big artists'}];
const SW={s:5,m:3.5,l:2};
const cache={};
function markup(pic){
  if(!cache[pic.id]) cache[pic.id]=pic.art();
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect x="-2" y="-2" width="404" height="404" stroke="none"/><g stroke="${INK}" stroke-width="${SW[pic.age]}" stroke-linejoin="round" stroke-linecap="round">${cache[pic.id]}</g></svg>`;
}
function renderPic(pic, fills){
  const wrap=document.createElement('div');
  wrap.innerHTML=markup(pic);
  const svg=wrap.firstElementChild, sw=SW[pic.age];
  svg.querySelectorAll('[data-s]').forEach(el=>el.setAttribute('stroke-width',f(sw/parseFloat(el.dataset.s))));
  const regions=[];
  svg.querySelectorAll('path,circle,ellipse,rect,polygon').forEach(el=>{
    if(el.classList.contains('k')){ el.setAttribute('fill',INK); el.style.pointerEvents='none'; return; }
    if(el.getAttribute('fill')==='none'){ el.style.pointerEvents='none'; return; }
    const i=regions.length; el.dataset.i=i; el.setAttribute('fill',fills[i]||'#ffffff'); regions.push(el);
  });
  return {svg,regions};
}

/* ============ saved progress ============ */
let progress={};
const KEY='colour-box-progress';
async function loadProgress(){
  try{
    if(window.storage){ const r=await window.storage.get(KEY,false); if(r&&r.value) progress=JSON.parse(r.value)||{}; }
    else { const v=localStorage.getItem(KEY); if(v) progress=JSON.parse(v)||{}; }
  }catch(e){}
}
let saveT;
function saveProgress(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{ try{
    const v=JSON.stringify(progress);
    if(window.storage) await window.storage.set(KEY,v,false); else localStorage.setItem(KEY,v);
  }catch(e){} },500);
}

/* ============ gallery ============ */
const $=id=>document.getElementById(id);
const state={age:'s',cat:'All'};
const CRAYONS=[['Red','#E8383D'],['Orange','#FF8A1F'],['Yellow','#FFD23F'],['Lime','#9BD13B'],['Green','#2FA84F'],['Teal','#19B5A5'],['Sky blue','#4FC3F7'],['Blue','#2E6BD8'],['Navy','#283593'],['Purple','#8E44AD'],['Lilac','#C39BE3'],['Pink','#FF7EB6'],['Magenta','#D81B78'],['Peach','#FFC7A1'],['Tan','#E0A96D'],['Brown','#8D5524'],['Dark brown','#5D3A1A'],['Grey','#9AA0A6'],['Black','#2A2238'],['White','#FFFFFF']];

(function logo(){
  const cols=['#E8383D','#FF8A1F','#FFD23F','#2FA84F','#4FC3F7','#2E6BD8','#8E44AD','#FF7EB6','#19B5A5','#E8383D'];
  const h=document.querySelector('.logo'); let k=0;
  h.innerHTML=[...'Colour Box'].map(ch=>ch===' '?'<span>&nbsp;</span>':`<span aria-hidden="true" style="color:${cols[k++%cols.length]}">${ch}</span>`).join('');
})();

function renderAges(){
  $('ages').innerHTML=AGES.map(a=>`<button class="age" role="tab" data-age="${a.k}" aria-selected="${a.k===state.age}"><b>${a.n}</b><small>${a.l}</small></button>`).join('');
}
function renderCats(){
  const cats=['All',...new Set(PICS.filter(p=>p.age===state.age).map(p=>p.cat))];
  if(!cats.includes(state.cat)) state.cat='All';
  $('cats').innerHTML=cats.map(c=>`<button class="cat" data-cat="${c}" aria-pressed="${c===state.cat}">${c==='All'?'Everything':c}</button>`).join('');
}
function renderGrid(){
  const grid=$('grid'); grid.innerHTML='';
  PICS.filter(p=>p.age===state.age&&(state.cat==='All'||p.cat===state.cat)).forEach(pic=>{
    const b=document.createElement('button'); b.className='tile'; b.dataset.id=pic.id;
    b.setAttribute('aria-label','Colour '+pic.name);
    const paper=document.createElement('span'); paper.className='paper';
    paper.appendChild(renderPic(pic,progress[pic.id]||{}).svg);
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=pic.name;
    b.append(paper,nm); grid.appendChild(b);
  });
}
function renderGallery(){ renderAges(); renderCats(); renderGrid(); }

$('ages').addEventListener('click',e=>{const b=e.target.closest('[data-age]'); if(!b) return; state.age=b.dataset.age; state.cat='All'; renderGallery();});
$('cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]'); if(!b) return; state.cat=b.dataset.cat; renderCats(); renderGrid();});
$('grid').addEventListener('click',e=>{const b=e.target.closest('.tile'); if(b) openPic(PICS.find(p=>p.id===b.dataset.id));});

/* ============ colouring ============ */
let cur=null, color=CRAYONS[0][1], erasing=false, undoStack=[], galleryScroll=0;

function buildTray(){
  const tray=$('tray');
  tray.innerHTML=CRAYONS.map(([n,c],i)=>`<button class="crayon" style="--c:${c}" data-c="${c}" aria-label="${n}" aria-pressed="${i===0}"><span class="tip"></span><span class="body"></span></button>`).join('')+
    `<label class="crayon custom" style="--c:#7FD8BE" aria-label="Mix your own colour"><span class="tip"></span><span class="body"></span><input type="color" id="mix" value="#7fd8be" aria-label="Mix your own colour"></label>`;
  tray.addEventListener('scroll',()=>{ if(tray.scrollTop) tray.scrollTop=0; });
  tray.addEventListener('click',e=>{const b=e.target.closest('button.crayon'); if(b) pick(b.dataset.c,b);});
  $('mix').addEventListener('input',e=>{const l=e.target.closest('.crayon'); l.style.setProperty('--c',e.target.value); pick(e.target.value,l);});
}
function pick(c,el){
  color=c; setEraser(false);
  document.querySelectorAll('.crayon').forEach(x=>x.setAttribute('aria-pressed',x===el));
}
function setEraser(on){
  erasing=on; $('eraser').setAttribute('aria-pressed',on);
  if(on) document.querySelectorAll('.crayon').forEach(x=>x.setAttribute('aria-pressed','false'));
}

function openPic(pic){
  galleryScroll=window.scrollY;
  const {svg,regions}=renderPic(pic,progress[pic.id]||{});
  cur={pic,svg,regions,celebrated:isDone(regions)};
  undoStack=[]; updateUndo();
  $('sheet').innerHTML=''; $('sheet').appendChild(svg);
  $('picName').textContent=pic.name;
  $('gallery').hidden=true; $('colour').hidden=false;
  if(!document.querySelector('.crayon[aria-pressed="true"]')&&!erasing) pick(CRAYONS[0][1],document.querySelector('.crayon'));
  window.scrollTo(0,0);
}
function closePic(){
  cur=null; $('colour').hidden=true; $('gallery').hidden=false;
  renderGrid(); window.scrollTo(0,galleryScroll);
}
function setFill(i,c){
  cur.regions[i].setAttribute('fill',c);
  const p=progress[cur.pic.id]||(progress[cur.pic.id]={});
  if(c==='#ffffff') delete p[i]; else p[i]=c;
}
function isDone(regions){ return regions.slice(1).every(r=>r.getAttribute('fill')!=='#ffffff'); }
function updateUndo(){ $('undo').disabled=!undoStack.length; }

$('sheet').addEventListener('click',e=>{
  if(!cur) return;
  const el=e.target.closest('[data-i]'); if(!el) return;
  const i=+el.dataset.i, prev=el.getAttribute('fill'), next=erasing?'#ffffff':color;
  if(prev===next) return;
  undoStack.push([[i,prev]]); setFill(i,next); updateUndo(); saveProgress();
  if(!cur.celebrated&&isDone(cur.regions)){ cur.celebrated=true; celebrate(); }
});
$('undo').addEventListener('click',()=>{
  const step=undoStack.pop(); if(!step||!cur) return;
  step.forEach(([i,c])=>setFill(i,c)); updateUndo(); saveProgress();
});
$('eraser').addEventListener('click',()=>{
  if(erasing){ const first=document.querySelector(`.crayon[data-c="${color}"]`)||document.querySelector('.crayon'); pick(first.dataset.c||color,first); }
  else setEraser(true);
});
$('clear').addEventListener('click',()=>{
  if(!cur) return;
  const step=[]; cur.regions.forEach((r,i)=>{const c=r.getAttribute('fill'); if(c!=='#ffffff'){step.push([i,c]); setFill(i,'#ffffff');}});
  if(step.length){ undoStack.push(step); updateUndo(); saveProgress(); toast('Fresh page! Undo brings it back.'); }
  cur.celebrated=false;
});
$('back').addEventListener('click',closePic);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&cur) closePic(); });

$('save').addEventListener('click',()=>{
  if(!cur) return;
  const clone=cur.svg.cloneNode(true); clone.setAttribute('width',1200); clone.setAttribute('height',1200);
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=cv.height=1200;
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,1200,1200); ctx.drawImage(img,0,0,1200,1200);
    cv.toBlob(b=>{
      const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download=cur.pic.name.replace(/\s+/g,'-').toLowerCase()+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      toast('Picture saved');
    },'image/png');
  };
  img.onerror=()=>toast('This picture could not be saved here');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
});

let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400);
}
function celebrate(){
  toast('You coloured every part!');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<46;i++){
    const b=document.createElement('span'); b.className='bit';
    b.style.left=Math.random()*100+'vw';
    b.style.background=CRAYONS[Math.floor(Math.random()*13)][1];
    b.style.animationDelay=Math.random()*.6+'s';
    b.style.animationDuration=1.4+Math.random()*1.2+'s';
    document.body.appendChild(b); setTimeout(()=>b.remove(),3400);
  }
}

buildTray();
renderGallery();
loadProgress().then(renderGrid);
</script>
</body>
</html>
